  - btop
  - matugen
  - swaybg
  - swaylock
  - playerctl
  - brightnessctl
  - pavucontrol
  - pipewire
  - wireplumber
  - neovim
  - xpad
  - orca
  - cascadia-code-nf-fonts
  - jetbrains-mono-fonts
